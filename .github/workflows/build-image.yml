# Build the web image off the box and publish it to GHCR.
#
# The VPS this deploys to has 3.8 GB of RAM with a live stack already holding
# most of it, and the image now bundles Python and Chromium on top of a Next
# build. Building there means competing for memory with the site that is
# currently serving, and an OOM kill halfway through a build is an outage caused
# by a deploy that had not even finished.
#
# So the server pulls a finished image and never compiles anything.

name: build image

on:
  push:
    branches: [master, resume-pivot]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/grindly-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The tests that would catch a broken image before it is published. The
      # Python suite is the one that matters: it holds the scorer's determinism
      # and the anti-fabrication gates, and both are load-bearing product
      # claims rather than implementation details.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npx tsc --noEmit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r agent/requirements.txt pytest
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest agent -q

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the registry, so a rebuild after a one-line change
          # does not reinstall Chromium.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_ID=${{ github.sha }}

      - name: what to pull
        run: |
          echo "Built and pushed:"
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/  /'
          echo ""
          echo "On the server:"
          echo "  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.ref_name }}"
          echo "  docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.ref_name }} grindly-web:latest"
