# Free uptime alerting, using the only always-on machine this project has
# that is not the VPS itself: GitHub's cron runners.
#
# The error table and the admin Health page only work while the app is up —
# when the box dies at 2am, the thing that would have reported it dies with
# it. This probe runs from outside, and a failed run makes GitHub email the
# repo owner (the default notification for failed workflows on your own
# repo). That is the whole feature: no dashboard, no account on a third
# service, one email when the site stops answering.
#
# NOTE: scheduled workflows run from the DEFAULT branch only (master), and
# GitHub treats the cron as best-effort — expect several minutes of slack,
# which is alerting, not monitoring. Also: GitHub disables schedules after 60
# days without repo activity; a push resets the clock.
#
# BILLING, learned the hard way: on a PRIVATE repo every probe run bills
# against the account's 2,000 free Actions minutes a month, and each run is
# ROUNDED UP to a whole minute even when the probe answers in five seconds.
# The original */5 cron demanded ~8,600 minutes — it exhausted the whole
# allowance in days, after which EVERY scheduled job failed at start
# ("payments have failed or your spending limit needs to be increased") and
# each failure sent an email. Hourly is ~745 minutes a month: alerting that
# leaves the other ~1,250 free minutes for CI and image builds.
name: uptime

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    # Must outlast the probe's worst case (8 attempts x 60s + curl timeouts).
    timeout-minutes: 12
    steps:
      - name: Probe https://grindly.in/api/health
        run: |
          # Eight attempts 60s apart (~7 minutes of tolerance). The previous
          # three-attempts-over-a-minute paged on every DEPLOY: the box builds
          # the image in place and the site is 502 for 2-7 minutes during one,
          # so each ship produced a "Run failed: uptime" email that meant
          # nothing. Seven-plus minutes of consecutive failure is longer than
          # any build window this box has ever had — that is an outage.
          for attempt in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /tmp/health.json -m 20 -w '%{http_code}' https://grindly.in/api/health || echo 000)
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/health.json; then
              echo "healthy (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            cat /tmp/health.json 2>/dev/null || true
            [ "$attempt" -lt 8 ] && sleep 60
          done
          echo "grindly.in health check failed for over seven minutes"
          exit 1
