# Beta product profile — auto-merged by `docker compose up` on the production
# host (and any host running the full stack from this repo).
#
# GRINDLY_TIER_B_APPLY is the hosted-submit switch for boards the user
# connected through the credential-login flow (Internshala). It is deliberately
# NOT defaulted on in docker-compose.yml — the base file must stay fail-closed —
# but the beta promise ("the agent applies for you") requires it: without it a
# connected user gets banked matches and queued browser tasks, and nothing the
# server can send on their behalf. Per-user consent + readiness + the daily cap
# still gate every send (agent/safety.py destination_policy, worker readiness
# re-check). Delete this file + `docker compose up -d` to revert the fleet.
services:
  web:
    environment:
      GRINDLY_TIER_B_APPLY: "1"
  worker:
    environment:
      GRINDLY_TIER_B_APPLY: "1"
