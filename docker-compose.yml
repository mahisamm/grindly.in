# Production stack: caddy (TLS) → web + worker fleet + postgres + redis.
# A one-shot `migrate` service creates the Postgres schema + seeds the admin
# before web/worker start. See PHASE3_DEPLOY_REPORT.md for the deploy runbook.
# Redis is provisioned for when the queue moves off the DB to BullMQ/Celery.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grindly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: grindly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grindly"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    logging: *default-logging
    restart: unless-stopped

  # One-shot: create/refresh the schema (prisma db push) + seed the admin, then
  # exit. web + worker wait for this to complete successfully.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: grindly-web
    command: sh -c "npx prisma db push --skip-generate && node scripts/seed-admin.mjs"
    environment:
      DATABASE_URL: postgresql://grindly:${POSTGRES_PASSWORD}@postgres:5432/grindly
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: grindly-web
    environment:
      # connection_limit lifts Prisma's tiny default (num_cpu*2+1 = 3 on a 1-vCPU
      # host) so /api/me polling from ~100 dashboards doesn't queue on the pool;
      # pool_timeout gives a request a few seconds to get a connection under a
      # burst instead of erroring. Well under Postgres max_connections (100).
      DATABASE_URL: postgresql://grindly:${POSTGRES_PASSWORD}@postgres:5432/grindly?connection_limit=15&pool_timeout=15
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      TRUST_PROXY: "1"              # behind Caddy — trust x-forwarded-for for rate limiting
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_OAUTH_BRAND_VERIFIED: ${GOOGLE_OAUTH_BRAND_VERIFIED:-}
      # Gmail runs on its own OAuth client so its restricted scope can't hold
      # login hostage behind Google verification (see .env.example).
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_SCAN_ENABLED: ${GMAIL_SCAN_ENABLED:-}
      # Single explicit payments switch — see .env.example. Must be "true" (not
      # just Razorpay keys being present) before /api/pay will do anything.
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      # Razorpay. Both keys are required for paid upgrades in production.
      # Local development without keys uses stub checkout. Setting KEY_ID flips /api/pay and
      # /api/pay/confirm into real-money mode, so KEY_SECRET must be set with it
      # — the secret is what verifies the payment signature.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      # Staged rollout of Internshala credential login (see .env.example)
      INTERNSHALA_BETA_EMAILS: ${INTERNSHALA_BETA_EMAILS:-}
      INTERNSHALA_BETA_OPEN: ${INTERNSHALA_BETA_OPEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # SMTP — password-reset mail and any web-side notification. Unset = the mail
      # is written to data/email-outbox.jsonl instead of being sent.
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASS: ${EMAIL_SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-Grindly <no-reply@grindly.in>}
      # Needed for the onboarding DM. Unset = written to data/slack-outbox.jsonl.
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
    expose:
      - "3000"
    volumes:
      # Shared with the worker: resume uploads + apply screenshots live here.
      - appdata:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: grindly-worker           # tagged so `sweep` can reuse it, not rebuild it
    environment:
      INTERNPILOT_DB: ""            # unset → db.py uses the Postgres DATABASE_URL
      DATABASE_URL: postgresql://grindly:${POSTGRES_PASSWORD}@postgres:5432/grindly
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      # "0" (headed) — NOT "1". Dockerfile.worker runs Chromium headed inside
      # an Xvfb virtual display specifically to eliminate headless-mode JS
      # probes (navigator.webdriver leaks, missing GPU renderer, etc — see
      # that file's comment). Setting this to "1" would launch real headless
      # Chromium instead, silently defeating the entire point of Xvfb while
      # still paying its startup cost — this was found and fixed as a bug.
      INTERNPILOT_HEADLESS: "0"
      # Persistent login sessions live here, on the shared appdata volume, so the
      # web app, the login worker, and every apply worker replica see the same profile.
      GRINDLY_PROFILE_BASE: /app/data/browser_profile
      GRINDLY_SPREAD_APPLIES: "1"   # human-pacing: 5-15 min gap between applies
      # Beta-safe anti-bot-detection ceilings (see .env.example) — must be set
      # here or worker.py falls back to its much looser code defaults (15 /
      # unlimited) instead of these.
      GRINDLY_CAP_PER_PLATFORM: ${GRINDLY_CAP_PER_PLATFORM:-5}
      GRINDLY_CAP_PER_RUN: ${GRINDLY_CAP_PER_RUN:-5}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Report delivery. The worker sends each user's daily report on the channel
      # they chose (profile.report_channel). Without these the email path falls
      # back to data/email-outbox.jsonl — persisted, but read by nobody, which is
      # exactly the state every report was in before this was wired up.
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASS: ${EMAIL_SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-Grindly <no-reply@grindly.in>}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      OPS_SLACK_CHANNEL: ${OPS_SLACK_CHANNEL:-ops-alerts}
    deploy:
      # Single browser-worker on a 1-vCPU host: two headed Chromium workers only
      # contend for the one core (no throughput gain) and can OOM the box. The
      # run queue serialises per user, so one worker drains 100 users' runs in
      # sequence — correct for an async "applies in the background" product.
      # Scale this back up the moment the host gains cores/RAM.
      # replicas MUST stay 1: claim_next()'s "no other running job for this
      # user" exclusion (run_queue.py) is a plain read alongside its
      # FOR UPDATE SKIP LOCKED claim, not itself lock-aware — two concurrent
      # claimers (i.e. replicas > 1) could both pass it for the same user
      # before either commits. Single-claimer-at-a-time (this) is what
      # actually prevents double-apply today; raising replicas needs that
      # exclusion query hardened first (e.g. SELECT ... FOR UPDATE on the
      # user's running rows too), not just a number bump.
      replicas: 1
      resources:
        limits:
          memory: 1.5G
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'worker.py --serve' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    volumes:
      - appdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # The thing that makes this a daily product rather than a button.
  #
  # worker --serve only DRAINS the run queue; nothing filled it, so the agent ran
  # exactly when a user pressed "Run agent" and never otherwise. This enqueues one
  # live run per active user per day, at a per-user hour derived from their id so
  # the whole fleet doesn't hit Internshala in the same minute every morning.
  #
  # Single replica, and it must stay that way: two of these would double-enqueue.
  # It only touches the DB (no browser), but reuses the worker image so there is
  # nothing extra to build.
  sweep:
    image: grindly-worker
    command: ["python", "agent/sweep.py", "--serve"]
    environment:
      INTERNPILOT_DB: ""
      DATABASE_URL: postgresql://grindly:${POSTGRES_PASSWORD}@postgres:5432/grindly
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'sweep.py' || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_started   # ensures the shared image is built first
    restart: unless-stopped

  # Remote-browser connect service — lets a hosted user (no local machine, no
  # screen) log into a job platform for real by watching/driving a live
  # browser stream in their dashboard. A single service process owns a small
  # isolated display/port pool (see agent/connect_service.py). Only
  # reachable from inside the compose network — Caddy proxies the public
  # /connect-ws/ path to it; it is never given a host port mapping.
  connect:
    build:
      context: .
      dockerfile: Dockerfile.connect
    environment:
      INTERNPILOT_DB: ""
      DATABASE_URL: postgresql://grindly:${POSTGRES_PASSWORD}@postgres:5432/grindly
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      GRINDLY_PROFILE_BASE: /app/data/browser_profile
      GRINDLY_CONNECT_MAX_SESSIONS: "2"
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1280M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'connect_service.py' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    volumes:
      - appdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # TLS terminator + reverse proxy. Auto-provisions Let's Encrypt certs for
  # $APP_DOMAIN. Public entrypoint — web is not exposed to the host directly.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddydata:/data
      - caddyconfig:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    logging: *default-logging
    depends_on:
      - web
    restart: unless-stopped

  # Daily pg_dump → /backup, 7-day retention, plus a restore drill that loads
  # each dump into a throwaway database and records the result in
  # backup_health — workerWatchdog.ts alerts if a cycle goes missing or the
  # restore fails, instead of finding out only when someone needs it.
  backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: []
    command: ["sh", "/scripts/backup-drill.sh"]
    volumes:
      - pgbackup:/backup
      - ./scripts/backup-drill.sh:/scripts/backup-drill.sh:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
  pgbackup:
  caddydata:
  caddyconfig:
