# Production stack: caddy (TLS) → web → postgres.
#
# Three services, down from nine. The previous stack ran a browser-worker fleet,
# a scheduler, a remote-browser connect service, a self-hosted metasearch engine
# and an answering-engine sidecar — about 4.75 GB of memory caps — because the
# product drove real browsers against job boards. This one renders PDFs.
#
# MEMORY: postgres 512M · web 1.5G · caddy 128M ≈ 2.2 GB of caps. The web
# container is the big one because it spawns headless Chromium to render
# resumes; a render peaks around 400 MB and several can overlap. A 4 GB VPS is
# comfortable. Add swap regardless.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grindly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: grindly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grindly"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }
    logging: *default-logging
    restart: unless-stopped

  # One-shot: bring the schema up to date, promote ADMIN_EMAIL if that account
  # exists, then exit.
  #
  # RUN IT YOURSELF, BEFORE `up -d`. It is behind a profile, so a plain
  # `docker compose up -d` does not touch it:
  #
  #     docker compose run --rm migrate     # must exit 0
  #     docker compose up -d                # only then
  #
  # It used to be a dependency of `web` — `service_completed_successfully` —
  # which sounded safe and was the opposite. `up -d` stops the running web
  # container before it evaluates dependencies, so when migrate failed there was
  # nothing left serving: the site returned 502 until a human noticed. A refused
  # migration should fail the DEPLOY and leave the CURRENT version running, and
  # that is only true if migrate is a separate step whose failure stops you from
  # taking the next one.
  #
  # It failed for real: `backup_health`, created by scripts/backup-drill.sh
  # outside Prisma's knowledge, looked to `db push` like a table to drop. It is
  # declared in schema.prisma now, and the ordering above is what stops the next
  # unmanaged table being an outage instead of a red line in a terminal.
  #
  # THIS RUNS `migrate deploy`, NOT `db push`, and the difference is the whole
  # point of the incident above. `db push` compares the live database to the
  # schema and invents a plan to reconcile them — a plan that includes dropping
  # anything it does not recognise, computed fresh on a production box at deploy
  # time. `migrate deploy` applies the exact SQL in prisma/migrations, which was
  # written locally, reviewed in a diff, and can touch nothing it does not name.
  # An unmanaged table is now invisible to it rather than a candidate for
  # deletion, and a deploy can no longer do anything that was not in the commit.
  #
  # It also never prompts and never needs `--accept-data-loss`: a destructive
  # change has to be written into a migration file by a human first, which is
  # exactly where that decision belongs.
  migrate:
    profiles: ["migrate"]
    build: { context: ., dockerfile: Dockerfile }
    image: grindly-web
    command: sh -c "npx prisma migrate deploy && node scripts/seed-admin.mjs"
    environment:
      DATABASE_URL: postgresql://grindly:${POSTGRES_PASSWORD_URLENCODED:?POSTGRES_PASSWORD_URLENCODED must be set}@postgres:5432/grindly
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    depends_on:
      postgres: { condition: service_healthy }
    logging: *default-logging
    restart: "no"

  web:
    build: { context: ., dockerfile: Dockerfile }
    image: grindly-web
    environment:
      # connection_limit lifts Prisma's default (num_cpu*2+1 = 3 on one vCPU) so
      # dashboard polling doesn't queue on the pool.
      DATABASE_URL: postgresql://grindly:${POSTGRES_PASSWORD_URLENCODED:?POSTGRES_PASSWORD_URLENCODED must be set}@postgres:5432/grindly?connection_limit=15&pool_timeout=15
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY must be set}
      NODE_ENV: production
      # The image ships its own interpreter with the agent deps installed.
      PYTHON_BIN: /opt/agent-venv/bin/python
      # Behind Caddy, so x-forwarded-for is ours and trustworthy.
      TRUST_PROXY: "1"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://${APP_DOMAIN}}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-}
      GRINDLY_REDACT_PII: ${GRINDLY_REDACT_PII:-1}
      # Explicit switch — see lib/config.ts. Keys alone must never mean "live".
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASS: ${EMAIL_SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-Grindly <no-reply@grindly.in>}
      SENTRY_DSN: ${SENTRY_DSN:-}
    expose: ["3000"]
    volumes:
      # Uploaded resumes and rendered variant PDFs.
      - appdata:/app/data
    healthcheck:
      # The shallow check, deliberately: `?deep=1` spawns a Python interpreter,
      # and doing that every fifteen seconds forever is a background CPU tax for
      # information that only changes on deploy.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 1536M, cpus: "1.0" }
    logging: *default-logging
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.5" }
    logging: *default-logging
    depends_on: [web]
    restart: unless-stopped

  # Daily pg_dump with 7-day retention. A backup nobody has restored is a
  # hypothesis, so the drill script loads each dump into a throwaway database
  # and fails loudly if it will not restore.
  backup:
    image: postgres:16-alpine
    environment:
      DATABASE_URL: postgresql://grindly:${POSTGRES_PASSWORD_URLENCODED:?POSTGRES_PASSWORD_URLENCODED must be set}@postgres:5432/grindly
    entrypoint: []
    command: ["sh", "/scripts/backup-drill.sh"]
    volumes:
      - pgbackup:/backup
      - ./scripts/backup-drill.sh:/scripts/backup-drill.sh:ro
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.5" }
    logging: *default-logging
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
  pgbackup:
  caddydata:
  caddyconfig:
