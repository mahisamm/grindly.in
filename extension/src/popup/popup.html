<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 260px; margin: 0; font: 14px/1.5 system-ui, sans-serif; color: #1a1a1a; }
      .hd { background: #e3402a; color: #fff; padding: 12px 14px; font-weight: 700; }
      .bd { padding: 14px; }
      .st { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #bbb; }
      .dot.on { background: #22c55e; }
      .dot.off { background: #e3402a; }
      button, a.btn { display: block; width: 100%; box-sizing: border-box; text-align: center;
        border: none; border-radius: 8px; padding: 9px; font-size: 13px; font-weight: 600;
        cursor: pointer; text-decoration: none; margin-top: 8px; }
      .primary { background: #e3402a; color: #fff; }
      .ghost { background: #f1f1f1; color: #333; }
      .hint { font-size: 12px; color: #666; margin-top: 10px; }
      .paste { margin-top: 14px; padding-top: 12px; border-top: 1px solid #e5e5e5; }
      .paste label { display: block; font-size: 12px; color: #666; margin-bottom: 6px; }
      .paste .row { display: flex; gap: 6px; }
      .paste input { flex: 1; min-width: 0; border: 1px solid #ddd; border-radius: 8px;
        padding: 7px 8px; font-size: 12px; font-family: monospace; }
      .paste button { margin-top: 0; width: auto; padding: 7px 12px; }
      .msg { font-size: 12px; margin-top: 6px; }
      .msg.ok { color: #16803c; }
      .msg.err { color: #e3402a; }
      .auto { margin-top: 14px; padding-top: 12px; border-top: 1px solid #e5e5e5; }
      .auto .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .auto .ttl { font-size: 13px; font-weight: 700; }
      .sw { position: relative; width: 44px; height: 24px; border-radius: 999px;
        background: #d4d4d4; border: none; cursor: pointer; flex: none; padding: 0; margin: 0; }
      .sw.on { background: #22c55e; }
      .sw i { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
        border-radius: 50%; background: #fff; transition: left .15s; }
      .sw.on i { left: 23px; }
    </style>
  </head>
  <body>
    <div class="hd">Grindly Apply Assistant</div>
    <div class="bd">
      <div class="st"><span class="dot" id="dot"></span><span id="stTxt">Checking…</span></div>
      <a class="btn primary" id="connect" href="https://grindly.in/extension/connect" target="_blank">Connect to Grindly</a>
      <button class="ghost" id="disconnect" style="display:none">Disconnect</button>
      <div class="hint" id="hint">Open a job on Internshala, LinkedIn, Naukri, Unstop or Indeed and click “Fill with Grindly”. You always click Submit yourself.</div>

      <!-- Autopilot. Hidden until connected, because it can do nothing without
           an account to claim tasks for. The copy states what it will and will
           NOT do, in the same place the switch is: a toggle whose consequences
           are described on a different page is a toggle people flip blind. -->
      <div class="auto" id="autoBox" style="display:none">
        <div class="row">
          <span class="ttl">Autopilot</span>
          <button class="sw" id="autoSw" role="switch" aria-checked="false" aria-label="Autopilot"><i></i></button>
        </div>
        <div class="hint" id="autoHint">
          Off — Grindly only fills forms you open yourself.
        </div>
      </div>
      <div class="paste" id="pasteBox">
        <label for="pasteInput">Connect automatically didn't work? Paste your pairing code from the Grindly connect page:</label>
        <div class="row">
          <input id="pasteInput" type="text" placeholder="Pairing code" autocomplete="off" spellcheck="false" />
          <button class="ghost" id="pasteBtn">Connect</button>
        </div>
        <div class="msg" id="pasteMsg"></div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
