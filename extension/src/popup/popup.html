<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 260px; margin: 0; font: 14px/1.5 system-ui, sans-serif; color: #1a1a1a; }
      .hd { background: #e5533c; color: #fff; padding: 12px 14px; font-weight: 700; }
      .bd { padding: 14px; }
      .st { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #bbb; }
      .dot.on { background: #22c55e; }
      .dot.off { background: #e5533c; }
      button, a.btn { display: block; width: 100%; box-sizing: border-box; text-align: center;
        border: none; border-radius: 8px; padding: 9px; font-size: 13px; font-weight: 600;
        cursor: pointer; text-decoration: none; margin-top: 8px; }
      .primary { background: #e5533c; color: #fff; }
      .ghost { background: #f1f1f1; color: #333; }
      .hint { font-size: 12px; color: #666; margin-top: 10px; }
    </style>
  </head>
  <body>
    <div class="hd">Grindly Apply Assistant</div>
    <div class="bd">
      <div class="st"><span class="dot" id="dot"></span><span id="stTxt">Checking…</span></div>
      <a class="btn primary" id="connect" href="https://grindly.in/extension/connect" target="_blank">Connect to Grindly</a>
      <button class="ghost" id="disconnect" style="display:none">Disconnect</button>
      <div class="hint" id="hint">Open a job on Internshala, LinkedIn, Naukri, Unstop or Indeed and click “Fill with Grindly”. You always click Submit yourself.</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
