# SearXNG configuration for Grindly's web-discovery source.
#
# This instance exists to answer ONE kind of question — "where can this student
# apply for an internship directly?" — for the agent only. It is not exposed
# publicly (no ports in docker-compose.yml), so it is reachable at
# http://searxng:8080 from inside the compose network and nowhere else.

use_default_settings: true

general:
  instance_name: "Grindly Discovery"
  # Nothing here is a user-facing search page; no donation/contact links.
  donation_url: false
  contact_url: false
  # Do not attach engine error details to results the agent parses.
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  # The whole point: `json` is what makes this an API. Without it SearXNG
  # answers only in HTML and the adapter would be scraping its own search page.
  formats:
    - html
    - json

server:
  # Overridden by SEARXNG_SECRET from the environment; a literal here would be a
  # committed secret.
  secret_key: "overridden-by-SEARXNG_SECRET-env"
  # The limiter is bot protection for PUBLIC instances. This one is private to
  # the compose network, and the limiter's own token/challenge flow would reject
  # the agent's plain JSON GETs — turning a working search into an empty result
  # set with no error. Access control here is network isolation, not the limiter.
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

ui:
  static_use_hash: true

outgoing:
  # Upstream engines are the scarce resource. Pace and cap concurrency so this
  # instance stays under their radar — an IP that gets blocked stops discovery
  # for every user at once.
  request_timeout: 10.0
  max_request_timeout: 15.0
  pool_connections: 20
  pool_maxsize: 10
  enable_http2: true

# Engine selection. Google is deliberately NOT relied on: it blocks datacenter
# IPs fastest, and a blocked primary engine silently empties every result set.
# DuckDuckGo + Bing + Brave tolerate server-side querying far better, and
# metasearch means one engine failing degrades the result list instead of
# ending the search.
#
# Measured from the production VPS on 2026-07-29, because the code elsewhere had
# been carrying a stale claim that every engine was blocked and `site:` queries
# were useless — written during one throttled window and never re-checked:
#
#   answering   brave, duckduckgo, yandex      (site: operators work fine)
#   refusing    google cse "too many requests", mojeek "access denied",
#               startpage "Suspended: CAPTCHA"
#
# The refusing three are left enabled on purpose. They cost one failed request
# each and cost nothing else — a refusal is per-engine, not per-search — and the
# block is on this datacenter IP, not permanent. websearch.engines_refusing()
# records what actually happened per run, so the next person reads a
# measurement instead of a comment.
engines:
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  - name: mojeek
    disabled: false
  # Verified from the production VPS: Yandex returns current employer ATS
  # postings for the site's job-specific queries when the other general
  # engines are empty. It remains behind the existing employer-only filters.
  - name: yandex
    disabled: false
  - name: startpage
    disabled: false
  # Added for breadth. Both are independent indexes rather than another Bing
  # front-end, so what they add is genuinely different pages, and neither has a
  # history of blocking server-side querying.
  - name: qwant
    disabled: false
  - name: mullvad leta
    disabled: false
  # Everything below is noise for a job search and only spends upstream quota.
  - name: wikipedia
    disabled: true
  - name: wikidata
    disabled: true
  - name: currency
    disabled: true
  - name: duckduckgo images
    disabled: true
  - name: bing images
    disabled: true
